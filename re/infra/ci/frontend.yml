name: Frontend CI - Astro

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/infra/ci/frontend.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/infra/ci/frontend.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test

# Note:
# Deployment is handled by Cloudflare Git integration for Workers Static Assets.
# When Cloudflare is linked to this repository, pushes to `main` automatically
# deploy the `frontend/` directory. No additional deploy step is required here.
