name: Frontend build (D3 fallback)

# Decision D3 fallback: astro build && wrangler deploy via workflow_dispatch.
# Default path is Cloudflare Workers Builds (P0-E2).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: newprojects/frontend
    env:
      RENDER_MODE: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: newprojects/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping deploy (wire secret in P0-E2)."
            exit 0
          fi
          npx wrangler deploy --env "${{ inputs.environment }}"
